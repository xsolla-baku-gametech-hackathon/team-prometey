services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - meshdiff_storage:/app/storage
    environment:
      - MESHDIFF_STORAGE_ROOT=/app/storage
      - MESHDIFF_DB_PATH=/app/storage/meshdiff.db

  frontend:
    image: python:3.12-slim
    working_dir: /site
    volumes:
      - ./frontend:/site
    ports:
      - "8080:8080"
    command: python3 -m http.server 8080
    depends_on:
      - backend

volumes:
  meshdiff_storage:

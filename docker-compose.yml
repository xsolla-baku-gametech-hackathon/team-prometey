services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - meshdiff_storage:/app/storage
    environment:
      - MESHDIFF_STORAGE_ROOT=/app/storage
      - MESHDIFF_DB_PATH=/app/storage/meshdiff.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  meshdiff_storage:
